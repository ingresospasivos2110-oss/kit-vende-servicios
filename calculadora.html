<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de meta diaria</title><meta name="description" content="Calcula las visitas y ventas necesarias para una meta de ingresos diaria."><style>body{max-width:720px;margin:3rem auto;padding:0 1rem;background:#f7f4ed;color:#18221f;font:17px/1.5 system-ui}h1{font-size:clamp(2rem,7vw,4rem);line-height:1}label{display:block;font-weight:700;margin-top:1rem}input{box-sizing:border-box;width:100%;padding:.65rem;font:inherit;border:1px solid #9baaa1;border-radius:6px}.result{margin-top:1.5rem;padding:1.2rem;background:#fff;border-radius:10px}.button{display:inline-block;margin-top:1rem;padding:.75rem 1rem;background:#c7f36b;color:#18221f;text-decoration:none;font-weight:700;border-radius:6px}</style></head><body><a href="index.html">← Kit Vende Servicios</a><h1>¿Qué hace falta para US$10 al día?</h1><p>Una estimación, no una garantía. Usa tus datos reales y actualízala semanalmente.</p><label>Meta diaria (USD)<input id="goal" type="number" min="1" value="10"></label><label>Precio del producto (USD)<input id="price" type="number" min="1" value="9"></label><label>Comisión estimada (%)<input id="fee" type="number" min="0" max="99" value="10"></label><label>Conversión de visita a compra (%)<input id="conversion" type="number" min="0.1" max="100" step="0.1" value="2"></label><div class="result" id="result" aria-live="polite"></div><a class="button" href="index.html#kit">Crear mi oferta</a><script>const ids=['goal','price','fee','conversion'];function calc(){const g=+goal.value,p=+price.value,f=+fee.value/100,c=+conversion.value/100;if(!g||!p||!c||f>=1){result.textContent='Introduce valores válidos.';return}const net=p*(1-f),sales=Math.ceil(g/net),visits=Math.ceil(sales/c);result.innerHTML=`<strong>Necesitas aproximadamente ${sales} venta${sales===1?'':'s'} diaria${sales===1?'':'s'}.</strong><br>Ingreso neto estimado por venta: US$${net.toFixed(2)}.<br>Con una conversión de ${(c*100).toFixed(1)}%, apunta a ${visits} visitas cualificadas al día. Mide tus datos reales: si la conversión baja, mejora la oferta antes de publicar más.`}ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));calc()</script></body></html>
